name: namegen CD

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: read
    id-token: write

jobs:
    npm:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ports/ts
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 12

            # Caching is intentionally disabled for release builds.

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - name: stamp version from tag
              run: pnpm pkg set version="${GITHUB_REF_NAME#v}"
            - run: pnpm run generate
            - run: pnpm run typecheck
            - run: pnpm test
            - run: pnpm run build
            - name: stage publish to npm
              run: npm stage publish --access public --provenance

    docker:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/metadata-action@v6
              id: meta
              with:
                  # The MCP image gets its own name so it isn't tied to the repo name.

                  images: ghcr.io/${{ github.repository_owner }}/namegen-mcp
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                      type=raw,value=latest
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    aliases:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - name: move the major and minor tags onto this release
              run: bash scripts/alias/tags.sh
