name: namegen CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    go:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: go mod download
            - run: go build ./...
            - run: go vet ./...
            - run: go test ./... -race -count=1

    mcp:
        needs: go
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mcp
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: mcp/go.mod
            - run: go mod download
            - run: go build ./...
            - run: go vet ./...
            - run: go test ./... -race -count=1

    ts:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ports/ts
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: ports/ts/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm run generate
            - run: pnpm run typecheck
            - run: pnpm test
            - run: pnpm run build
